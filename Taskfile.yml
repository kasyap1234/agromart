version: "3"

vars:
  TEST_DATABASE_URL: "postgres://postgres:secret@localhost:5436/inventory_test?sslmode=disable"
  TEST_MIGRATIONS_PATH: "./apps/server/sql/schema"

tasks:
  # Bring up disposable Postgres for tests
  test:db:up:
    desc: "Start disposable Postgres for tests on port 5436"
    cmds:
      - docker compose -f docker-compose.test.yml up -d
      - echo "Waiting for Postgres healthcheck..."
      - bash -c 'for i in {1..60}; do
            docker inspect --format "{{json .State.Health.Status }}" agromart2-postgres-test 2>/dev/null | grep -q healthy && exit 0;
            sleep 1;
          done; echo "Postgres did not become healthy in time" >&2; exit 1'

  # Tear down the disposable DB
  test:db:down:
    desc: "Stop and remove disposable Postgres for tests"
    cmds:
      - docker compose -f docker-compose.test.yml down -v

  # Run migrations against the disposable DB using golang-migrate CLI
  test:db:migrate:
    desc: "Apply DB migrations (golang-migrate) to disposable Postgres"
    cmds:
      - bash -c 'command -v migrate >/dev/null 2>&1 || { echo "golang-migrate CLI not installed"; exit 1; }'
      - bash -c '[ -d "{{.TEST_MIGRATIONS_PATH}}" ] || { echo "Migrations path {{.TEST_MIGRATIONS_PATH}} not found"; exit 1; }'
      - bash -c 'migrate -path "{{.TEST_MIGRATIONS_PATH}}" -database "{{.TEST_DATABASE_URL}}" up || true'

  # sqlc generate (supports either root or apps/server config)
  sqlc:generate:
    desc: "Generate sqlc code"
    cmds:
      - bash -c 'if [ -f sqlc.yaml ]; then
            command -v sqlc >/dev/null 2>&1 && sqlc version || echo "sqlc not installed";
            sqlc generate -f sqlc.yaml;
          elif [ -f apps/server/sqlc.yaml ]; then
            pushd apps/server >/dev/null;
            command -v sqlc >/dev/null 2>&1 && sqlc version || echo "sqlc not installed";
            sqlc generate;
            popd >/dev/null;
          else
            echo "No sqlc.yaml found at root or apps/server; skipping";
          fi'

  # Backend unit tests (no special tags)
  test:server:unit:
    desc: "Run backend unit tests"
    cmds:
      - go test ./apps/server/... -count=1

  # Backend integration tests (require DB up and migrated). Uses build tag: integration
  test:server:integration:
    desc: "Run backend integration tests (expects disposable DB up and migrated)"
    env:
      DATABASE_URL: "{{.TEST_DATABASE_URL}}"
    cmds:
      - go test ./apps/server/integration -tags=integration -count=1

  # Composite: spin up DB, migrate, run unit+integration, tear down
  test:server:all:
    desc: "End-to-end: start test DB, migrate, run unit and integration tests, tear down"
    cmds:
      - task: sqlc:generate
      - task: test:db:up
      - task: test:db:migrate
      - task: test:server:unit
      - task: test:server:integration
      - task: test:db:down
    silent: false
