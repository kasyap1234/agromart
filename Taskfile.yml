version: '3'

vars:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

env:
  DOCKER_BUILDKIT: "{{.DOCKER_BUILDKIT}}"
  COMPOSE_DOCKER_CLI_BUILD: "{{.COMPOSE_DOCKER_CLI_BUILD}}"

tasks:
  dev:build:
    desc: Start dev stack; build only if images are missing. Always prints ps snapshot.
    cmds:
      - bash -lc |
          set -euo pipefail
          echo "--- Check if images exist (backend, frontend) ---"
          NEED_BUILD=0
          if ! docker compose images --quiet | grep -q "[a-zA-Z0-9]"; then
            NEED_BUILD=1
          fi
          if [ "$NEED_BUILD" -eq 1 ]; then
            echo "--- Images missing -> Build (pull + plain progress, 15m timeout) ---"
            timeout 15m docker compose build --pull --progress=plain
          else
            echo "--- Images already present -> Skipping build ---"
          fi
          echo "--- Up (detached) ---"
          docker compose up -d --remove-orphans
          echo "--- DEV ps ---"
          docker compose ps
    silent: false

  dev:rebuild:
    desc: Force rebuild without cache (plain progress, 15m timeout) and restart dev stack
    cmds:
      - bash -lc 'set -euo pipefail; echo "--- Build (no-cache + plain progress, 15m timeout) ---"; timeout 15m docker compose build --no-cache --progress=plain'
      - bash -lc 'echo "--- Up (detached) ---"; docker compose up -d --remove-orphans'
      - bash -lc 'echo "--- DEV ps ---"; docker compose ps'

  dev:up:
    desc: Start dev stack (db, backend, frontend) in background (no build)
    cmds:
      - bash -lc 'set -euo pipefail; docker compose up -d --remove-orphans && docker compose ps'

  dev:down:
    desc: Stop and remove dev stack with volumes
    cmds:
      - bash -lc 'set -euo pipefail; docker compose down -v --remove-orphans'

  dev:logs:
    desc: Tail backend logs for development
    cmds:
      - bash -lc 'set -euo pipefail; docker compose logs -f backend'

  dev:health:
    desc: Probe dev backend and frontend health
    cmds:
      - bash -lc 'set -e; echo "# backend"; (curl -i -sS http://localhost:8080/health | sed -n "1,40p") || true; echo; echo "# frontend"; (curl -i -sS http://localhost:3000 | sed -n "1,40p") || true'

  prod:build:
    desc: Build AND start production stack (build images, then up) using docker-compose.prod.yml
    cmds:
      - bash -lc 'set -euo pipefail; DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 docker build --target runtime -t agromart-backend:prod -f Dockerfile .'
      - bash -lc 'set -euo pipefail; DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 docker build -t agromart-frontend:prod -f docker/frontend.Dockerfile .'
      - bash -lc 'set -euo pipefail; docker compose -f docker-compose.prod.yml up -d --remove-orphans'
      - bash -lc 'echo "--- PROD ps ---"; docker compose -f docker-compose.prod.yml ps'

  prod:rebuild:
    desc: Force rebuild images without cache and restart production stack
    cmds:
      - bash -lc 'set -euo pipefail; DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 docker build --no-cache --target runtime -t agromart-backend:prod -f Dockerfile .'
      - bash -lc 'set -euo pipefail; DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 docker build --no-cache -t agromart-frontend:prod -f docker/frontend.Dockerfile .'
      - bash -lc 'set -euo pipefail; docker compose -f docker-compose.prod.yml up -d --remove-orphans'
      - bash -lc 'echo "--- PROD ps ---"; docker compose -f docker-compose.prod.yml ps'

  prod:up:
    desc: Start production stack (db, backend, nginx) using docker-compose.prod.yml
    cmds:
      - bash -lc 'set -euo pipefail; docker compose -f docker-compose.prod.yml up -d --remove-orphans && docker compose -f docker-compose.prod.yml ps'

  prod:down:
    desc: Stop and remove production stack with volumes
    cmds:
      - bash -lc 'set -euo pipefail; docker compose -f docker-compose.prod.yml down -v --remove-orphans'

  prod:logs:
    desc: Tail nginx logs for production
    cmds:
      - bash -lc 'set -euo pipefail; docker compose -f docker-compose.prod.yml logs -f nginx'

  prod:health:
    desc: Probe production Nginx and backend health
    cmds:
      - bash -lc 'set -e; echo "# nginx root"; (curl -i -sS http://localhost/ | sed -n "1,40p") || true; echo; echo "# nginx /api/health"; (curl -i -sS http://localhost/api/health | sed -n "1,60p") || true; echo; echo "# backend direct :8080/health"; (curl -i -sS http://localhost:8080/health | sed -n "1,60p") || true'

  ci:prod:push:
    desc: Build and push production images via GH Actions workflow (requires repo secrets)
    cmds:
      - echo "This task is a placeholder; CI is handled by .github/workflows/docker-prod.yml"

