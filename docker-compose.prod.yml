services:
  db:
    image: postgres:17-alpine
    container_name: agromart-db
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h 127.0.0.1 || pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost || pg_isready -U ${DB_USER} -d ${DB_NAME} -h $${HOSTNAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ${DOCKER_IMAGE_BACKEND:-agromart-backend}:${IMAGE_TAG:-latest}
    container_name: agromart-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      APP_PORT: ${APP_APPPORT:-8080}
      APP_ENV: production
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
      JWT_SECRET: ${JWT_SECRET}
      MIGRATIONS_PATH: ${MIGRATIONS_PATH:-/root/sql/schema}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  frontend-build:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-/api}
    image: ${DOCKER_IMAGE_FRONTEND_BUILD:-agromart-frontend-build}:${IMAGE_TAG:-latest}
    container_name: agromart-frontend-build
    profiles: ["build"]
    # This stage just ensures the Next.js build runs; the nginx image will copy from source again

  nginx:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        - PUBLIC_API_URL=${PUBLIC_API_URL:-/api}
    image: ${DOCKER_IMAGE_NGINX:-agromart-frontend}:${IMAGE_TAG:-latest}
    container_name: agromart-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      # mount certs if provided (optional)
      - ./nginx/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  db_data: