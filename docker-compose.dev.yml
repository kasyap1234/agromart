services:
  db:
    image: postgres:17.5-alpine
    container_name: agromart-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: agromart
    volumes:
       - pgdata:/var/lib/postgresql/data
    ports:
       - "5432:5432"
    healthcheck:
       test: ["CMD-SHELL", "pg_isready -U postgres"]
       interval: 10s
       timeout: 5s
       retries: 5

  minio:
    image: minio/minio:latest
    container_name: agromart-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
       - minio_data:/data
    ports:
       - "9000:9000"
       - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
       test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
       interval: 30s
       timeout: 20s
       retries: 3

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: agromart-backend
    volumes:
      - ./.env:/app/.env
      - ./apps/server:/app/apps/server
    environment:
      APP_ENV: development
      APP_DB_HOST: db
      APP_DB_PORT: 5432
      APP_DB_USER: postgres
      APP_DB_PASSWORD: secret
      APP_DB_NAME: agromart
      APP_JWT_SECRET: supersecretjwt-change-me-for-local-dev-if-you-want
      MIGRATIONS_PATH: /app/sql/schema
      SEED_DEV: "false"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    command: ["/bin/sh", "-lc", "set -e; echo \"[ENTRY] Waiting db healthy and running migrations\"; migrate -path ${MIGRATIONS_PATH} -database postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@${APP_DB_HOST}:${APP_DB_PORT}/${APP_DB_NAME}?sslmode=disable up || echo \"[ENTRY] migrate up returned non-zero (possibly already applied). Continuing\"; echo \"[ENTRY] Starting API (cmd/api with SEED_DEV=${SEED_DEV})\"; ./main"]

  client:
    build:
      context: apps/client
      dockerfile: Dockerfile

    container_name: agromart-client
    volumes:
      - ./apps/client:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  minio_data: