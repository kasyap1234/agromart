services:
  db:
    image: postgres:17.5-alpine
    container_name: agromart-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: agromart
    volumes:
       - pgdata:/var/lib/postgresql/data
    ports:
       - "5432:5432"
    healthcheck:
       test: ["CMD-SHELL", "pg_isready -U postgres"]
       interval: 10s
       timeout: 5s
       retries: 5

  minio:
    image: minio/minio:latest
    container_name: agromart-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
       - minio_data:/data
    ports:
       - "9000:9000"
       - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
       test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
       interval: 30s
       timeout: 20s
       retries: 3

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: agromart-backend
    volumes:
      - ./.env:/app/.env
      - ./apps/server:/app/apps/server
    environment:
      APP_ENV: development
      APP_DB_HOST: db
      APP_DB_PORT: 5432
      APP_DB_USER: postgres
      APP_DB_PASSWORD: secret
      APP_DB_NAME: agromart
      APP_JWT_SECRET: supersecretjwt-change-me-for-local-dev-if-you-want
      SEED_DEV: "false"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Note: Migrations are now handled externally by golang-migrate CLI via dev-start.sh
    command: ["./main"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  client:
    build:
      context: apps/client
      dockerfile: Dockerfile

    container_name: agromart-client
    volumes:
      - ./apps/client:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  minio_data: