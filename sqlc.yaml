version: "2"
sql:
  - engine: "postgresql"
    queries: "apps/server/sql/queries"
    schema: "apps/server/sql/schema"
    gen:
      go:
        package: "db"
        out: "db"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
