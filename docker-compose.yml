services:
  db:
    image: postgres:17-alpine
    container_name: agromart-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: password
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME} -h 127.0.0.1 || pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost || pg_isready -U ${DB_USER} -d ${DB_NAME} -h $${HOSTNAME}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: agromart-backend:latest
    container_name: agromart-backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # App
      APP_PORT: ${APP_APPPORT:-8080}
      APP_ENV: ${APP_ENV:-development}
      GO_ENV: ${APP_ENV:-development}
      # DB
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-supersecretjwt}
      # Migrations
      MIGRATIONS_PATH: ${MIGRATIONS_PATH:-/root/sql/schema}
      # Dev seed
      SEED_DEV: "true"
    ports:
      - "8080:8080"
    healthcheck:
      # cmd/api also serves /health via HealthHandler and /api/health, keep legacy path
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/health || wget -qO- http://localhost:8080/api/health || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    command:
      [
        "/bin/sh",
        "-lc",
        'set -e; echo "[ENTRY] Waiting db healthy and running migrations"; migrate -path ${MIGRATIONS_PATH} -database postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable up || echo "[ENTRY] migrate up returned non-zero (possibly already applied). Continuing"; echo "[ENTRY] Starting API with SEED_DEV=${SEED_DEV}"; ./main',
      ]

  frontend:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    image: agromart-frontend:latest
    container_name: agromart-frontend
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8080/api}
    ports:
      - "3000:3000"

volumes:
  db_data:
