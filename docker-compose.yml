version: "3.9"

services:
  db:
    image: postgres:17-alpine
    container_name: agromart-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: agromart-backend:latest
    container_name: agromart-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # App
      APP_PORT: "8080"
      APP_ENV: "development"
      # DB
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: secret
      DB_NAME: inventory
      DB_MAX_CONNS: "25"
      # JWT
      JWT_SECRET: "supersecretjwt"
      # Migrations
      MIGRATIONS_PATH: "/root/sql/schema"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    command: ["/bin/sh", "-lc", "set -e; echo \"[ENTRY] Waiting db healthy and running migrations\"; migrate -path ${MIGRATIONS_PATH} -database postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable up || echo \"[ENTRY] migrate up returned non-zero (possibly already applied). Continuing\"; echo \"[ENTRY] Starting API\"; ./main"]

  frontend:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    image: agromart-frontend:latest
    container_name: agromart-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: "http://localhost:8080/api"
    ports:
      - "3000:3000"

volumes:
  db_data:
