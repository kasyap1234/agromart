# AgroMart CI/CD Pipeline
# Comprehensive GitHub Actions workflow for testing, building, and deployment

name: AgroMart CI/CD Pipeline

on:
  push:
    branches: [ main, develop, staging ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  GITHUB_USERNAME: ${{ github.actor }}

jobs:
  # Job 1: Automated Testing
  test:
    name: Automated Testing
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: agromart_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.5'
        
    - name: Set up Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install golang-migrate
      run: |
        curl -L https://github.com/golang-migrate/migrate/releases/latest/download/migrate.linux-amd64.tar.gz | tar xvz
        sudo mv migrate /usr/local/bin/

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Cache Node modules
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('apps/client/bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install frontend dependencies
      run: |
        cd apps/client
        bun install

    - name: Run CI tests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: secret
        DB_NAME: agromart_test
        SKIP_E2E: true  # Skip E2E in CI for faster builds
      run: |
        chmod +x scripts/ci-test.sh
        ./scripts/ci-test.sh

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ github.run_id }}
        path: ci-test-report.json

  # Job 2: Security Scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Job 3: Build and Deploy (Development)
  build-deploy-dev:
    name: Build & Deploy Development
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    environment: development
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install golang-migrate
      run: |
        curl -L https://github.com/golang-migrate/migrate/releases/latest/download/migrate.linux-amd64.tar.gz | tar xvz
        sudo mv migrate /usr/local/bin/

    - name: Deploy to Development
      env:
        ENVIRONMENT: dev
        GITHUB_USERNAME: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DB_HOST: ${{ secrets.DB_HOST_DEV }}
        DB_USER: ${{ secrets.DB_USER_DEV }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD_DEV }}
        JWT_SECRET: ${{ secrets.JWT_SECRET_DEV }}
        VERSION_TAG: dev-${{ github.sha }}
      run: |
        chmod +x scripts/prod-deploy.sh
        ./scripts/prod-deploy.sh deploy

    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dev-deployment-${{ github.run_id }}
        path: docker-compose.dev.yml

  # Job 4: Build and Deploy (Staging)
  build-deploy-staging:
    name: Build & Deploy Staging
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install golang-migrate
      run: |
        curl -L https://github.com/golang-migrate/migrate/releases/latest/download/migrate.linux-amd64.tar.gz | tar xvz
        sudo mv migrate /usr/local/bin/

    - name: Deploy to Staging
      env:
        ENVIRONMENT: staging
        GITHUB_USERNAME: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DB_HOST: ${{ secrets.DB_HOST_STAGING }}
        DB_USER: ${{ secrets.DB_USER_STAGING }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD_STAGING }}
        JWT_SECRET: ${{ secrets.JWT_SECRET_STAGING }}
        VERSION_TAG: staging-${{ github.sha }}
      run: |
        chmod +x scripts/prod-deploy.sh
        ./scripts/prod-deploy.sh deploy

    - name: Run E2E tests against staging
      env:
        STAGING_URL: ${{ secrets.STAGING_URL }}
      run: |
        cd apps/client
        PLAYWRIGHT_BASE_URL=$STAGING_URL npx playwright test --reporter=html

    - name: Upload staging E2E results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: staging-e2e-results-${{ github.run_id }}
        path: apps/client/playwright-report/

  # Job 5: Build and Deploy (Production)
  build-deploy-production:
    name: Build & Deploy Production
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install golang-migrate
      run: |
        curl -L https://github.com/golang-migrate/migrate/releases/latest/download/migrate.linux-amd64.tar.gz | tar xvz
        sudo mv migrate /usr/local/bin/

    - name: Deploy to Production
      env:
        ENVIRONMENT: prod
        GITHUB_USERNAME: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DB_HOST: ${{ secrets.DB_HOST_PROD }}
        DB_USER: ${{ secrets.DB_USER_PROD }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD_PROD }}
        JWT_SECRET: ${{ secrets.JWT_SECRET_PROD }}
        VERSION_TAG: prod-${{ github.sha }}
      run: |
        chmod +x scripts/prod-deploy.sh
        ./scripts/prod-deploy.sh deploy

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: AgroMart ${{ github.ref_name }}
        draft: false
        prerelease: false

  # Job 6: Tag Release Build
  tag-release:
    name: Tag Release Build
    runs-on: ubuntu-latest
    needs: [test, security]
    if: startsWith(github.ref, 'refs/tags/v')
    
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract version from tag
      id: extract_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Install golang-migrate
      run: |
        curl -L https://github.com/golang-migrate/migrate/releases/latest/download/migrate.linux-amd64.tar.gz | tar xvz
        sudo mv migrate /usr/local/bin/

    - name: Build Release Images
      env:
        ENVIRONMENT: prod
        GITHUB_USERNAME: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION_TAG: ${{ steps.extract_version.outputs.VERSION }}
        SKIP_TESTS: true  # Already tested in previous job
      run: |
        chmod +x scripts/prod-deploy.sh
        ./scripts/prod-deploy.sh build

  # Job 7: Cleanup
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [build-deploy-dev, build-deploy-staging, build-deploy-production, tag-release]
    if: always()
    
    steps:
    - name: Cleanup old packages
      uses: actions/delete-package-versions@v5
      with:
        package-name: 'agromart-backend'
        package-type: 'container'
        min-versions-to-keep: 10
        delete-only-untagged-versions: true

    - name: Cleanup old packages
      uses: actions/delete-package-versions@v5
      with:
        package-name: 'agromart-frontend'
        package-type: 'container'
        min-versions-to-keep: 10
        delete-only-untagged-versions: true

    - name: Cleanup old packages
      uses: actions/delete-package-versions@v5
      with:
        package-name: 'agromart-minio'
        package-type: 'container'
        min-versions-to-keep: 10
        delete-only-untagged-versions: true