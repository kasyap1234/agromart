name: Load Testing CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run comprehensive load tests every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of load test to run'
        required: true
        default: 'comprehensive'
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike
          - comprehensive
      vus:
        description: 'Number of virtual users'
        required: false
        default: '100'
        type: string
      duration:
        description: 'Test duration'
        required: false
        default: '5m'
        type: string

env:
  K6_VERSION: v0.45.0
  API_BASE_URL: ${{ secrets.API_BASE_URL || 'http://localhost:8080/api' }}
  TEST_ENV: ${{ github.event.inputs.test_type || 'ci' }}

jobs:
  load-testing:
    name: Load Testing Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-scenario:
          - auth
          - products
          - dashboard
          - sessions

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: agromart
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install k6
        run: |
          sudo apt update
          sudo apt install -y apt-transport-https gnupg
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt update
          sudo apt install -y k6

      - name: Verify k6 installation
        run: k6 version

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Setup test environment
        run: |
          # Start backend service
          docker-compose -f docker-compose.test.yml up -d
          # Wait for services to be ready
          sleep 30
          # Run database migrations if needed
          # Add any additional setup steps

      - name: Validate test configuration
        run: npm run validate-config

      - name: Setup test data
        run: npm run setup-test-data
        env:
          DATABASE_URL: postgresql://postgres:secret@localhost:5432/agromart

      - name: Run smoke tests
        if: matrix.test-scenario == 'auth'
        run: |
          k6 run \
            --vus 10 \
            --duration 30s \
            --out json=reports/smoke-test-results.json \
            k6-tests/scenarios/auth-workflow-test.js
        env:
          K6_API_BASE_URL: ${{ env.API_BASE_URL }}

      - name: Run authentication load tests
        if: matrix.test-scenario == 'auth'
        run: |
          k6 run \
            --vus ${{ github.event.inputs.vus || 100 }} \
            --duration ${{ github.event.inputs.duration || '5m' }} \
            --out json=reports/auth-load-test-results.json \
            --out html=reports/auth-load-test-report.html \
            k6-tests/scenarios/auth-workflow-test.js
        env:
          K6_API_BASE_URL: ${{ env.API_BASE_URL }}
          K6_TEST_ENV: ${{ env.TEST_ENV }}

      - name: Run product CRUD load tests
        if: matrix.test-scenario == 'products'
        run: |
          k6 run \
            --vus ${{ github.event.inputs.vus || 200 }} \
            --duration ${{ github.event.inputs.duration || '7m' }} \
            --out json=reports/products-load-test-results.json \
            --out html=reports/products-load-test-report.html \
            k6-tests/scenarios/product-crud-test.js
        env:
          K6_API_BASE_URL: ${{ env.API_BASE_URL }}
          K6_TEST_ENV: ${{ env.TEST_ENV }}

      - name: Run dashboard analytics load tests
        if: matrix.test-scenario == 'dashboard'
        run: |
          k6 run \
            --vus ${{ github.event.inputs.vus || 150 }} \
            --duration ${{ github.event.inputs.duration || '6m' }} \
            --out json=reports/dashboard-load-test-results.json \
            --out html=reports/dashboard-load-test-report.html \
            k6-tests/scenarios/dashboard-analytics-test.js
        env:
          K6_API_BASE_URL: ${{ env.API_BASE_URL }}
          K6_TEST_ENV: ${{ env.TEST_ENV }}

      - name: Run concurrent sessions load tests
        if: matrix.test-scenario == 'sessions'
        run: |
          k6 run \
            --vus ${{ github.event.inputs.vus || 300 }} \
            --duration ${{ github.event.inputs.duration || '8m' }} \
            --out json=reports/sessions-load-test-results.json \
            --out html=reports/sessions-load-test-report.html \
            k6-tests/scenarios/concurrent-sessions-test.js
        env:
          K6_API_BASE_URL: ${{ env.API_BASE_URL }}
          K6_TEST_ENV: ${{ env.TEST_ENV }}

      - name: Run file upload tests
        if: matrix.test-scenario == 'products'
        run: |
          k6 run \
            --vus 50 \
            --duration 5m \
            --out json=reports/file-upload-test-results.json \
            --out html=reports/file-upload-test-report.html \
            k6-tests/scenarios/file-upload-test.js
        env:
          K6_API_BASE_URL: ${{ env.API_BASE_URL }}
          K6_TEST_ENV: ${{ env.TEST_ENV }}

      - name: Generate comprehensive report
        if: always()
        run: |
          npm run generate-report
          # Generate performance summary
          echo "## Load Testing Results" > $GITHUB_STEP_SUMMARY
          echo "- **Test Type**: ${{ matrix.test-scenario }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ env.TEST_ENV }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration**: ${{ github.event.inputs.duration || '5m' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Virtual Users**: ${{ github.event.inputs.vus || '100' }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: load-test-results-${{ matrix.test-scenario }}-${{ github.run_id }}
          path: |
            reports/
            k6-tests/reports/
          retention-days: 30

      - name: Performance regression check
        if: always()
        run: |
          # Compare with baseline if available
          if [ -f "reports/baseline-${{ matrix.test-scenario }}.json" ]; then
            echo "Comparing with baseline performance..."
            # Add baseline comparison logic here
          fi

      - name: Cleanup test data
        if: always()
        run: npm run cleanup-test-data

      - name: Notify on failure
        if: failure()
        run: |
          echo "Load testing failed for scenario: ${{ matrix.test-scenario }}"
          # Add notification logic here (Slack, email, etc.)

  comprehensive-load-test:
    name: Comprehensive Load Test Suite
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'comprehensive' || github.event_name == 'schedule'
    needs: load-testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install k6
        run: |
          sudo apt update
          sudo apt install -y k6

      - name: Run comprehensive load test suite
        run: |
          k6 run \
            --vus 500 \
            --duration 15m \
            --out json=reports/comprehensive-test-results.json \
            --out html=reports/comprehensive-test-report.html \
            k6-tests/main-test-runner.js
        env:
          K6_API_BASE_URL: ${{ env.API_BASE_URL }}
          K6_TEST_ENV: ${{ env.TEST_ENV }}
          K6_ENABLE_MONITORING: 'true'

      - name: Upload comprehensive test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: comprehensive-load-test-results-${{ github.run_id }}
          path: reports/
          retention-days: 30

  performance-monitoring:
    name: Performance Monitoring
    runs-on: ubuntu-latest
    if: always()
    needs: [load-testing, comprehensive-load-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download test results
        uses: actions/download-artifact@v3
        with:
          path: reports/

      - name: Analyze performance trends
        run: |
          # Analyze performance trends and generate insights
          npm run generate-report
          echo "Performance analysis completed"

      - name: Create performance dashboard
        run: |
          # Generate performance dashboard
          echo "Performance dashboard created"

      - name: Set performance baseline
        if: github.ref == 'refs/heads/main'
        run: |
          # Update performance baseline for main branch
          echo "Performance baseline updated"

      - name: Performance alert
        if: failure()
        run: |
          echo "Performance regression detected!"
          # Add alerting logic here

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    if: always()
    needs: [load-testing, comprehensive-load-test, performance-monitoring]

    steps:
      - name: Cleanup old artifacts
        run: |
          # Clean up old test artifacts if needed
          echo "Cleanup completed"