name: Frontend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/client/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/client/**'

env:
  NODE_VERSION: '20'
  WORKING_DIRECTORY: ./apps/client

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: apps/client/package-lock.json

    - name: Install dependencies
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npm ci

    - name: Run ESLint
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npm run lint

    - name: TypeScript type check
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npm run type-check

    - name: Run unit tests
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npm run test:coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: ${{ env.WORKING_DIRECTORY }}
        file: coverage/lcov.info
        flags: frontend-unit
        name: frontend-unit-coverage

    - name: Build application
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npm run build

    - name: Check bundle size
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npx bundle-analyzer build/static/js/*.js

  security-scan:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: apps/client/package-lock.json

    - name: Install dependencies
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npm ci

    - name: Run security audit
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npm audit --audit-level high

    - name: Run Snyk security scan
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npx snyk test --severity-threshold=high
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      continue-on-error: true

    - name: Check for vulnerabilities
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        if [ $(npm audit --audit-level high --json | jq '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical') -gt 0 ]; then
          echo "High or critical vulnerabilities found!"
          exit 1
        fi

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: apps/client/package-lock.json

    - name: Install dependencies
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npm ci

    - name: Install Playwright browsers
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npx playwright install --with-deps

    - name: Setup PostgreSQL
      uses: harmon758/postgresql-action@v1
      with:
        postgresql version: '15'
        postgresql password: 'password'
        postgresql db: 'agromart_test'

    - name: Run E2E tests
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npm run test:e2e
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/agromart_test

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: apps/client/playwright-report/
        retention-days: 30

  lighthouse-performance:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: apps/client/package-lock.json

    - name: Install dependencies
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npm ci

    - name: Build application
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npm run build

    - name: Run Lighthouse
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        npm install -g @lhci/cli
        lhci autorun --config=lighthouserc.json

  deployment-prep:
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan, e2e-tests]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: apps/client/package-lock.json

    - name: Install dependencies
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npm ci

    - name: Build for production
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npm run build
      env:
        NODE_ENV: production

    - name: Run production tests
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npm run test

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: apps/client/.next/
        retention-days: 30

    - name: Deploy to staging
      if: github.event_name == 'push'
      run: |
        echo "Deploying to staging environment"
        # Add your deployment commands here

    - name: Deploy to production
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "Deploying to production environment"
        # Add your production deployment commands here