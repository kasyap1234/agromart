name: Build and Push Docker Images (Prod)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to use (default: yyyymmddHHMM)"
        required: false
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "docker/**"
      - "apps/**"
      - "Caddyfile"
      - ".github/workflows/docker-prod.yml"
      - "!nginx/**"

env:
  REGISTRY: docker.io
  # Set these in repo secrets:
  # DOCKERHUB_USERNAME
  # DOCKERHUB_TOKEN
  # DOCKERHUB_REPO (defaults to 'agromart' if not set)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: vars
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(date -u +%Y%m%d%H%M)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          REPO="${{ secrets.DOCKERHUB_REPO }}"
          if [ -z "$REPO" ]; then
            REPO="agromart"
          fi
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.vars.outputs.repo }}-backend:${{ steps.vars.outputs.tag }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          build-args: |
            PUBLIC_API_URL=/api
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.vars.outputs.repo }}-frontend:${{ steps.vars.outputs.tag }}

      - name: Summary
        run: |
          echo "Pushed images:"
          echo "  ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.vars.outputs.repo }}-backend:${{ steps.vars.outputs.tag }}"
          echo "  ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.vars.outputs.repo }}-frontend:${{ steps.vars.outputs.tag }}"