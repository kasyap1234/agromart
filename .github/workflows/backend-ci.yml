name: Backend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/server/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/server/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'

env:
  GO_VERSION: '1.24'
  POSTGRES_DB: agromart_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23', '1.24']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go ${{ matrix.go-version }}
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: go mod download

    - name: Run go vet
      run: go vet ./...

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m

    - name: Run tests with coverage
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: backend-unit
        name: backend-unit-coverage

    - name: Check test coverage threshold
      run: |
        go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//' | \
        awk '{if ($1 < 85) {print "Coverage " $1 "% is below 85% threshold"; exit 1} else {print "Coverage " $1 "% meets threshold"}}'

  security-scan:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run Gosec Security Scanner
      uses: securecodewarrior/github-action-gosec@master
      with:
        args: '-no-fail -fmt sarif -out results.sarif ./...'

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: results.sarif

    - name: Run dependency vulnerability check
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

  integration-tests:
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install dependencies
      run: go mod download

    - name: Setup test database
      run: |
        psql postgresql://postgres:password@localhost:5432/agromart_test -c "
          CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
        "

    - name: Run integration tests
      run: go test -v -tags=integration ./...
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/agromart_test

  performance-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run benchmarks
      run: go test -bench=. -benchmem -run=^$ ./...

    - name: Generate benchmark report
      run: |
        go test -bench=. -benchmem -run=^$ ./... > benchmark_results.txt
        cat benchmark_results.txt

  build-and-docker:
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan, integration-tests]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build application
      run: |
        cd apps/server
        go build -v -o server .

    - name: Build Docker image
      run: |
        docker build -t agromart-backend:${{ github.sha }} ./apps/server
        docker tag agromart-backend:${{ github.sha }} agromart-backend:latest

    - name: Run Docker container tests
      run: |
        docker run --rm agromart-backend:${{ github.sha }} --help || true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-build
        path: |
          apps/server/server
        retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://api.agromart.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to staging
      run: |
        echo "Deploying backend to staging environment"
        # Add your staging deployment commands here
        # Example: kubectl apply -f k8s/staging/

    - name: Run smoke tests on staging
      run: |
        echo "Running smoke tests on staging"
        # Add smoke test commands here

    - name: Deploy to production
      run: |
        echo "Deploying backend to production environment"
        # Add your production deployment commands here
        # Example: kubectl apply -f k8s/production/

    - name: Run production health checks
      run: |
        echo "Running production health checks"
        # Add health check commands here