version: "3.9"

services:
  postgres_test:
    image: postgres:17-alpine
    container_name: agromart2-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: inventory_test
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_test_data: